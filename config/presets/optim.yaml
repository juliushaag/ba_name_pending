# Optimizer bundles. Every component owning an optimizer spends these in its own
# create_optimizer() via networks/optim.adam(); the LR *schedule* is a separate
# multiplicative factor built once per run (run/defaults.yaml: lr_warmup_steps,
# lr_decay, and Policy.lr_schedule).
#
# `grad_clip_mode` is one of global_norm / element / none, and the three bundles
# below follow dime_am, which clips only its control net and only element-wise
# (cont_time_policy.py: `chain(zero_nans(), clip(1.0), adam(lr))` on the actor,
# a bare `adam(lr, b1)` on critic and dual). The distinction is not cosmetic:
# under Adam a global-norm clip preserves the gradient's direction exactly, so
# an outlier sample that dominates the batch still dominates the update, and
# only the element-wise clip bounds what one sample can contribute. AMDP is the
# case that made this matter -- its actor gradient norm reaches 384 against a
# clip of 1.0, so every one of its updates was direction-only.

critic:      {lr: 3.0e-4, adam_b1: 0.5, grad_clip: 1.0, grad_clip_mode: global_norm}
actor:       {lr: 3.0e-4, adam_b1: 0.9, grad_clip: 1.0, grad_clip_mode: element}  # 0.9 is optax.adam's own default, stated so it is logged
dual:        {lr: 1.0e-3, adam_b1: 0.9, grad_clip: 1.0, grad_clip_mode: global_norm}
