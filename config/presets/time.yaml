# Time/level embedding bundles. `time_dim` is the width of the encoding
# concatenated to the action; `time_kwargs` configures the frequency ladder.

sin_16:
  time_dim: 8
  time_embed: sin
  time_kwargs: {num_freqs: 16, freq_min: 0.1, freq_max: 100.0, hidden: 32,
                concat_input: true, spacing: geometric}

sin_20:
  extends: [time.sin_16]
  time_kwargs: {num_freqs: 20}

# NC-LQL conditions on a noise *level* rather than a diffusion time.
fourier:
  extends: [time.sin_16]
  time_dim: 16
  time_embed: fourier

# PISGRADNet's time coder (diffusion/common/models/pisgrad_net.py), which is what
# DIME's sampler conditions on: `num_hid` linearly spaced frequencies, a trainable
# zero-init phase, sin/cos with no raw `t`, then Dense -> gelu -> Dense out to
# `time_coder_out`. All three widths are the reference's `num_hid: 256`.
pisgrad:
  time_dim: 256
  time_embed: fourier
  time_kwargs: {num_freqs: 256, freq_min: 0.1, freq_max: 100.0, hidden: 256,
                concat_input: false, spacing: linear}
