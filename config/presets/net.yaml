# MLP style bundles -- the ten kwargs every component that builds an MLP restates
# (mlp.py's MLP_KWARGS). A component entry names one with `extends:` instead of
# spelling the block out, which is what these exist for: the same nine lines used
# to be copy-pasted into all thirteen entries of the old flat components.yaml.
#
# Bundles may `extends:` each other; `plain` is the root everything else deltas
# against. Nested dicts (norm_kwargs) deep-merge, so a bundle can add one key to
# an inherited dict without restating it.

plain:
  activation: silu
  norm: none
  norm_stem: false
  norm_input: false
  norm_after_act: true
  dropout: 0.0
  final_activation: false
  residual: false
  dtype: bfloat16
  norm_kwargs: {}          # `norm: none` takes none; the bundles below add what theirs needs

silu: {extends: [net.plain]}
gelu: {extends: [net.plain], activation: gelu}
mish: {extends: [net.plain], activation: mish}
relu: {extends: [net.plain], activation: relu}

# A LayerNorm stem, for a net whose bootstrap comes from a separate target-net
# forward (see net.crossq for why that matters).
layer_silu: {extends: [net.plain], norm: layer, norm_kwargs: {epsilon: 1.0e-5}}
layer_relu:
  extends: [net.relu]
  norm: layer
  norm_stem: true
  norm_input: true
  norm_kwargs: {epsilon: 1.0e-5}

# CrossQ (Bhatt et al., ICLR 2024): BatchRenorm over the shared [(s,a), (s',a')]
# forward, which is what replaces a Polyak target net. `norm` is load-bearing
# rather than cosmetic here -- pairing a running-statistic norm with a target net
# is what QCriticBase raises on.
crossq:
  extends: [net.relu]
  norm: batchrenorm
  norm_stem: true
  norm_input: true
  norm_kwargs: {momentum: 0.99, warmup_steps: 100000, epsilon: 1.0e-3, r_max: 3.0, d_max: 5.0}
