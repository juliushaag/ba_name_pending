# Named capacity ladders -- the one knob a size comparison varies.
#
#   components: {critic: {class: C51Critic, size: large}}
#   scripts/submit.py ... --set model.components.critic.size=small
#
# Every slot whose component declares a `kind:` listed here must name a `size:`,
# and nothing else may set the keys these tables own (scripts/lint_config.py
# enforces both). That is what makes `large` mean one thing across every critic
# class, so an {algo x size} sweep compares algorithms at equal capacity rather
# than at whatever each class's baseline happened to be.
#
# Each ladder is *width at fixed depth*: one axis, monotone, directly
# interpretable as parameter count. Depth is deliberately not on it -- a net that
# needs a different depth states `layers:` inline on the slot, and
# scripts/print_config.py reports it as shadowing the size.
#
# Note barl's MLP puts a stem ahead of `layers` blocks, so a critic's `layers: 1`
# is two Dense blocks, not one (see networks/mlp.py). The ladders are in barl's
# units, not the reference papers'.

critic:
  small:  {latent_dim: 256,  layers: 1, n_models: 2}
  medium: {latent_dim: 512,  layers: 1, n_models: 2}
  large:  {latent_dim: 1024, layers: 1, n_models: 2}
  xlarge: {latent_dim: 2048, layers: 1, n_models: 2}

actor:
  small:  {latent_dim: 256,  layers: 2}
  medium: {latent_dim: 512,  layers: 2}
  large:  {latent_dim: 1024, layers: 2}
  xlarge: {latent_dim: 2048, layers: 2}
