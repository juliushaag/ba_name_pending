# Defaults + run list for scripts/offline_learning.py
# Run with: uv run python scripts/offline_learning.py [--config path/to/this.yaml]
#
# NOTE: this script trains against Environment.get_dataset(), which requires
# an offline-dataset-backed environment (e.g. OGBench) to be registered --
# the MuJoCo Gym / DeepMind Control Suite environments currently in
# src/barl/environments/ are online-only and will raise NotImplementedError
# here. Point `env` at whatever offline-dataset environment you register.

defaults:
  num_epochs: 200
  batch_size: 256
  num_workers: 4
  prefetch_factor: 4
  eval_every: 20000    # grad steps between evals
  eval_runs: 50
  log_every: 10        # batches between stat logs

runs:
  - model: IQLPolicy
    env: CHANGE_ME   # an Environment with get_dataset() implemented
