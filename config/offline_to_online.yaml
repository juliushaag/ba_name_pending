# Defaults + run list for scripts/offline_to_online.py
# Run with: uv run python scripts/offline_to_online.py [--config path/to/this.yaml]
#
# NOTE: this script also needs Environment.get_dataset() for the offline
# half of the mix -- see config/offline_learning.yaml's note.

defaults:
  checkpoint: null
  num_iterations: 100
  rollout_steps: 50000
  num_envs: 32
  buffer_size: 256
  traj_len: 250
  epochs_per_rollout: 16
  batch_size: 1024
  eval_every: 10000
  eval_runs: 50
  log_every: 10
  offline_start_frac: 1.0   # fraction of transitions drawn from the offline dataset at the start
  offline_end_frac: 0.0     # fraction of transitions drawn from the offline dataset once annealing has finished
  anneal_iterations: 50     # outer iterations over which the offline fraction is annealed

runs:
  - model: IQLPolicy
    env: CHANGE_ME   # an Environment with get_dataset() implemented
