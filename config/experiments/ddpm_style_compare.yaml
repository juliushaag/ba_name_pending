# A run of the same DDPMActor (SDAC) on two MLP styles, switched by the
# config-driven `net_style` selector -- a configuration value on the class,
# not an inheritance choice. Structural Configs are varied with a grid/slot
# override (`model.components.<slot>.<key>` sits above the class's Config
# defaults), never with an HPO axis.
#
# Note: SDAC's own model YAML pins `activation: Mish` on the slot, which
# shadows the style's activation for this model. For a clean gelu-vs-silu
# comparison pin activation alongside, or use a model that doesn't override it.
axes:
  algo: [SDAC]
  env:  [HalfCheetah]
  model.components.actor.net_style: [gelu, silu]