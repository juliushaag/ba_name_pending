# Example sweep spec for scripts/run_sweep.py:
#
#   uv run python scripts/run_sweep.py --grid config/sweep_grid.yaml --dry_run
#   uv run python scripts/run_sweep.py --grid config/sweep_grid.yaml
#
# Every run is one point of the cross product of `axes`, minus anything
# `exclude` matches, launched as its own OS process. Four kinds of axis:
#
#   algo / env / seed   the run's model, environment, and seed
#   model.<dotted>      a model override -- layered over config/models.yaml
#                       (and any profile) for that run only, so sweeping a
#                       tunable never means editing the model config
#   run.<key>           a key of the run config (config/online_learning.yaml's
#                       `defaults:`), e.g. run.batch_size, run.utd_ratio
#
# `uv run python scripts/print_config.py <model>` lists the dotted paths a
# `model.` axis can name; a path that resolves to nothing aborts the run
# before any training starts rather than silently sweeping a no-op axis.
#
# --algos/--envs/--seeds/--set on the command line override the axis of the
# same name here, so this file can also serve as the base for one-off runs.

base: config/online_learning.yaml

axes:
  algo: [AMDP, SACPolicy]
  env:  [HalfCheetah, Walker2d]
  seed: [0, 1, 2]

  model.components.critic.rho: [0.0, 2.0]
  # model.components.critic.class: [MeanStdEnsembleCritic, QRDistributionalCritic]
  # model.params.entropy_scale: [-1.0, -2.0]
  # run.utd_ratio: [0.5, 1.0]

exclude:
  # SAC's critic reduction ignores rho, so the second value would just be a
  # duplicate run -- prune it rather than pay for it.
  - {algo: SACPolicy, model.components.critic.rho: 0.0}
