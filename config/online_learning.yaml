# Defaults + run list for scripts/online_learning.py
# Run with: uv run python scripts/online_learning.py [--config path/to/this.yaml]
#
# `defaults` holds every knob that used to be a CLI flag (or a hardcoded
# module constant). `runs` is a list of {model, env, ...} -- each entry is
# merged onto `defaults` and run in series, so listing several algorithms
# here trains them one after another in a single invocation.
#
# Merge order per run: `defaults` < `env_defaults[<that run's env>]` < the run
# entry itself. A run entry (or either defaults level) may also carry
# `model_overrides:`, a dotted-path map layered over config/models.yaml on top
# of any profile -- `{components.critic.rho: 1.0, params.entropy_scale: -2.0}`
# -- which is how a tunable gets varied without editing the model config.
# Unlike every other key those merge key-wise across the three levels instead
# of replacing wholesale. scripts/run_sweep.py's `model.*`/`run.*` grid axes
# write exactly these.

defaults:
  checkpoint: null          # path to resume from, or null to train from scratch
  total_env_steps: 500000  # stop once this many env steps have been collected
  random_steps: 0       # random-action buffer fill before training starts (off-policy only, see main())
  rollout_steps: 5000      # env steps collected per outer iteration (across all num_envs)
  num_envs: 32             # parallel rollout envs (policy inference is flat in
                            # batch size out to ~512, so the whole batch costs
                            # what one env would; episodes persist across
                            # rollouts, so this no longer shortens the horizon)
  buffer_size: 1000000       # max transitions kept in the replay buffer (whole
                             # trajectory chunks are evicted/kept, never split,
                             # so this is a budget, not an exact count)
  epochs_per_rollout: 32    # on-policy only: train_epoch passes over the buffer per outer iteration

  utd_ratio: 1.0            # off-policy only: grad steps per outer iteration = round(rollout_steps * utd_ratio)

  lr_warmup_steps: 1000     # grad steps of linear 0 -> base_lr ramp before the sine decay to 0 kicks in

  batch_size: 256
  compile: true            # torch.compile the policy's train_step (forward +
                            # backward); costs a one-off warmup at startup
  compile_inference: true   # torch.compile inference_step under CUDA graphs.
                            # Separate from `compile` because a rollout-heavy
                            # actor gains far more here (3-15x) than train_step
                            # does, and the two fail independently. Adds one
                            # warmup per batch shape -- num_envs, then 1 at the
                            # first eval.
  eval_every: 10000         # grad steps between eval2s 
  eval_runs: 10
  eval_videos: 2            # of those runs, how many render frames (chosen at
                            # random). Rendering costs ~140x the env step, so
                            # this is most of an eval's wall clock. null = all.
  log_every: 10             # grad steps between primary-tier logs (one headline key per quantity)
  debug_every: 200          # grad steps between debug-tier logs (min/max/std/quantiles, grad health)

# Per-env overrides of anything above, applied to every run on that env (in
# this file's `runs:` and in every scripts/run_sweep.py grid alike) -- so a
# sweep spanning envs of very different cost/horizon doesn't need one run
# entry per env just to restate the same handful of keys.
env_defaults: {}
  # Humanoid:
  #   total_env_steps: 5000000
  #   num_envs: 64
  # InvertedPendulum:
  #   total_env_steps: 200000
