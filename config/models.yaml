# Per-policy component specs + named profiles/aliases. Separate from
# config/online_learning.yaml (the run/training-loop config) -- this only
# controls architecture (which component class each Policy's slots use, and
# their kwargs), never touched by the run scripts directly. See
# src/barl/model_config.py for the resolution order (this file's per-policy
# `components:` < the active profile's overrides < any explicit kwarg the
# Policy itself passes to resolve_component()).
#
# Every slot's kwargs are written out in full here -- there is no
# per-component default file to fall back on. Switching a slot's `class:`
# (e.g. critic: MeanStdEnsembleCritic -> QRDistributionalCritic, or squash: TanhSquash
# -> ErfSquash) means writing out *all* of that class's required kwargs right
# here; nothing else fills in the gaps, so a missing one surfaces immediately
# as a plain missing-argument TypeError from the component's own __init__.
#
# `model:` in a run config (config/online_learning.yaml's `runs:`) can name
# either a plain Policy class below, or one of the `aliases:` shortcuts,
# which resolve to a (policy, profile) pair.
#
# Critic slots accept any QCriticBase subclass from src/barl/networks/critic.py:
# MeanStdEnsembleCritic / MeanEnsembleCritic / MinEnsembleCritic (n_models MLP
# heads, differing only in mean/min/mean-minus-rho*std reduction), or
# QRDistributionalCritic / C51Critic (single-head return-distribution critics,
# QR-DQN vs. standard fixed-support categorical C51).

aliases:
  SACSmall: {policy: SACPolicy, profile: Small}
  SACLarge: {policy: SACPolicy, profile: Large}

SACPolicy:
  params:
    entropy_scale: -1.0

  components:
    actor:    {class: StochasticActor, hidden_dim: 256, layers: 3, squash_cls: TanhSquash}
    # critic: {class: QRDistributionalCritic, hidden_dim: 2048, layers: 2, num_quantiles: 100}
    critic:   {class: MeanStdEnsembleCritic, hidden_dim: 512, layers: 2, n_models: 10, rho: 2.0, polyak_tau: 0.005, gamma: 0.99}
    
    entropy:  {class: AutotuneRegulator, lr: 3e-4, alpha_init: 0.05, min_alpha: 0.01, max_alpha: 10.0 }

  profiles:
    Small:
      actor:  {hidden_dim: 128, layers: 2}
      critic: {hidden_dim: 128, layers: 2, n_models: 2}
    Large:
      actor:  {hidden_dim: 512, layers: 3}
      critic: {hidden_dim: 512, layers: 3, n_models: 5}

DIMEPolicy:
  params:
    entropy_scale: -4.0
  
  components:
    actor: 
      class: ScoreDiscreteActor
      latent_dim: 256
      layers: 3
      num_steps: 20
      beta_min: 0.12
      beta_max: 0.18
      beta_scale_min: 0.7
      beta_scale_max: 1.8
      learn_beta_scale: true
      eta_init: 1.5811 # sqrt(2.5)
      learn_eta: false
      anchor_score: true,
      noise_start: 0.999
      noise_end: 0.001

    # critic: {class: QRDistributionalCritic, hidden_dim: 2048, layers: 2, num_quantiles: 100}
    critic: {class: MinEnsembleCritic, hidden_dim: 512, layers: 2, n_models: 10, rho: 2.0, polyak_tau: 0.005, gamma: 0.99}
    squash: {class: TanhSquash}
    entropy: {class: AutotuneRegulator, lr: 3e-4, alpha_init: 0.001, min_alpha: 0.0001, max_alpha: 10.0 }

AMDP:
  params:
    entropy_scale: -1.5

  components:
    actor:  {class: ScoreContinuousActor, latent_dim: 256, layers: 3, max_steps: 16, sigma_min: 2.0, sigma_max: 2.5, tau_min: 0.0, tau_max: 1.0 }
    # critic: {class: QRDistributionalCritic, hidden_dim: 2048, layers: 2, num_quantiles: 100}
    critic: {class: MeanStdEnsembleCritic, hidden_dim: 512, layers: 2, n_models: 10, rho: 2.0, polyak_tau: 0.005, gamma: 0.99}
    squash: {class: ErfSquash}   # `k` is always derived at construction time -- see AMDP.__init__
    entropy: {class: AutotuneRegulator, lr: 3e-4, alpha_init: 0.05, min_alpha: 0.01, max_alpha: 10.0}
    trust_region: {class: AutotuneRegulator,  lr: 3e-4, alpha_init: 0.05, min_alpha: 1.0e-6, max_alpha: 10.0, target: 0.2}


SDAC:
  params:
    entropy_scale: -1.0
    num_candidates: 20
    explore_init: 0.1

    components:
      class: ScoreDiscreteActor
      latent_dim: 256
      layers: 3
      num_steps: 20
      beta_min: 0.12
      beta_max: 0.18
      beta_scale_min: 0.7
      beta_scale_max: 1.8
      learn_beta_scale: true
      eta_init: 1.5811 # sqrt(2.5)
      learn_eta: false
      anchor_score: true,
      noise_start: 0.999
      noise_end: 0.001

    # critic: {class: QRDistributionalCritic, hidden_dim: 2048, layers: 2, num_quantiles: 100}
    critic: {class: MinEnsembleCritic, hidden_dim: 512, layers: 2, n_models: 10, rho: 2.0, polyak_tau: 0.005, gamma: 0.99}
    squash: {class: TanhSquash}   # `k` is always derived at construction time -- see AMDP.__init__
    entropy: {class: AutotuneRegulator, lr: 3e-4, alpha_init: 0.05, min_alpha: 0.01, max_alpha: 10.0}

PPOPolicy:
  params:
    gamma: 0.99
    lam: 0.95
    clip_eps: 0.2
    entropy_coef: 0.05
  components:
    actor:  {class: StochasticActor, hidden_dim: 256, layers: 4, squash_cls: TanhSquash}
    critic: {class: PPOCritic,       hidden_dim: 256, layers: 4}

IQLPolicy:
  params:
    tau: 0.7
    beta: 3.0
  components:
    actor:  {class: StochasticActor, hidden_dim: 256, layers: 6, squash_cls: TanhSquash}
    critic: {class: IQLCritic,       hidden_dim: 256, layers: 6, polyak_tau: 0.005, gamma: 0.99}

FlowQLPolicy:
  params:
    alpha: 100.0
  components:
    actor:  {class: DistilledFlowActor, latent_dim: 512, flow_steps: 16, time_dim: 8}
    critic: {class: MeanStdEnsembleCritic, hidden_dim: 512, layers: 4, n_models: 10, rho: 2.0, polyak_tau: 0.005, gamma: 0.99}

FlowBCPolicy:
  components:
    actor: {class: FlowBCActor, latent_dim: 512, flow_steps: 16, time_dim: 8, hidden_layers: 4}

DirectPolicy:
  components:
    actor: {class: DeterministicActor, hidden_dim: 128, layers: 4}


