# Per-policy component slots, policy-level params, and named profiles/aliases.
# Separate from config/online_learning.yaml (the run/training-loop config) --
# this only controls the model (which component class each Policy's slots use,
# their kwargs, and the Policy's own tunables), never touched by the run
# scripts directly.
#
# Each slot names its `class:` explicitly and then lists only what it wants to
# differ from that class's baseline in config/components.yaml -- the single
# defaults layer, keyed by component class name. Resolution order, lowest
# precedence first (see src/barl/model_config.py):
#
#   components.yaml's entry for the slot's `class:`
#     < this file's `components: {<slot>: {...}}`
#     < the active profile's override for that slot
#     < any explicit kwarg the Policy itself passes to resolve_component()
#
# `params:` (the Policy's own tunables, read off `self` in train_step) skips
# the components.yaml layer -- it has no `class:` -- but is profile-overridable
# the same way. Neither layer has a Python-level fallback: a kwarg listed in
# neither file is a missing-argument TypeError from the component's own
# __init__.
#
#   uv run python scripts/print_config.py <model> [--profile P]
#
# prints the fully resolved model with every value annotated by which layer
# above it came from.
#
# Switching a slot's `class:` (e.g. critic: MeanStdEnsembleCritic ->
# QRDistributionalCritic, or squash: TanhSquash -> ErfSquash) is a one-word
# edit as long as the new class has a components.yaml entry; if it doesn't,
# spell its kwargs out here instead. Nothing below needs to be edited to *try*
# an alternative, though -- a run config's `model_overrides:` (and therefore
# any scripts/run_sweep.py `model.` axis) can set both kwargs and the `class:`
# itself for one run only:
#
#   uv run python scripts/run_sweep.py --algos AMDP --envs HalfCheetah \
#       --set model.components.critic.class=QRDistributionalCritic
#
# `model:` in a run config (config/online_learning.yaml's `runs:`) can name
# either a plain Policy class below, or one of the `aliases:` shortcuts,
# which resolve to a (policy, profile) pair.
#
# Critic slots accept any QCriticBase subclass from src/barl/networks/critic.py:
# MeanStdEnsembleCritic / MeanEnsembleCritic / MinEnsembleCritic (n_models MLP
# heads, differing only in mean/min/mean-minus-rho*std reduction), or
# QRDistributionalCritic / C51Critic (single-head return-distribution critics,
# QR-DQN vs. standard fixed-support categorical C51).

aliases:
  SACSmall: {policy: SACPolicy, profile: Small}
  SACLarge: {policy: SACPolicy, profile: Large}

SACPolicy:
  params:
    entropy_scale: -1.0

  components:
    actor:    {class: StochasticActor, hidden_dim: 512, layers: 3}
    critic:   {class: MeanStdEnsembleCritic}
    entropy:  {class: AutotuneRegulator}

  profiles:
    Small:
      actor:  {hidden_dim: 128, layers: 2}
      critic: {hidden_dim: 128, layers: 2, n_models: 2}
    Large:
      actor:  {hidden_dim: 512, layers: 3}
      critic: {hidden_dim: 512, layers: 3, n_models: 5}

DIMEPolicy:
  params:
    entropy_scale: -4.0

  components:
    actor:   {class: ScoreDiscreteActor}
    critic:  {class: MinEnsembleCritic}
    squash:  {class: TanhSquash}
    entropy: {class: AutotuneRegulator, alpha_init: 0.001, min_alpha: 0.0001}

AMDP:
  params:
    entropy_scale: -1.5

  components:
    actor:   {class: ScoreContinuousActor}
    critic:  {class: MeanStdEnsembleCritic}
    squash:  {class: ErfSquash}
    entropy: {class: AutotuneRegulator}
    trust_region: {class: AutotuneRegulator, min_alpha: 1.0e-6, target: 0.2}

SDAC:
  params:
    entropy_scale: -1.0
    num_candidates: 20
    explore_init: 0.1

  components:
    actor:   {class: ScoreDiscreteActor, latent_dim: 256}
    critic:  {class: MinEnsembleCritic}
    squash:  {class: TanhSquash}
    entropy: {class: AutotuneRegulator}

PPOPolicy:
  params:
    gamma: 0.99
    lam: 0.95
    clip_eps: 0.2
    entropy_coef: 0.05
  components:
    actor:  {class: StochasticActor}
    critic: {class: PPOCritic}

IQLPolicy:
  params:
    tau: 0.7
    beta: 3.0
  components:
    actor:  {class: StochasticActor, layers: 6}
    critic: {class: IQLCritic}

FlowQLPolicy:
  params:
    alpha: 100.0
  components:
    actor:  {class: DistilledFlowActor}
    critic: {class: MeanStdEnsembleCritic, hidden_dim: 512, layers: 4}

FlowBCPolicy:
  components:
    actor: {class: FlowBCActor}

DirectPolicy:
  components:
    actor: {class: DeterministicActor}
