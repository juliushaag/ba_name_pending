# Per-policy component slots, policy-level params, and named profiles/aliases.
# Separate from config/online_learning.yaml (the run/training-loop config) --
# this only controls the model (which component class each Policy's slots use,
# their kwargs, and the Policy's own tunables), never touched by the run
# scripts directly.
#
# Each slot names its `class:` explicitly and then lists only what it wants to
# differ from that class's baseline in config/components.yaml -- the single
# defaults layer, keyed by component class name. Resolution order, lowest
# precedence first (see src/barl/model_config.py):
#
#   components.yaml's entry for the slot's `class:`
#     < this file's `components: {<slot>: {...}}`
#     < the active profile's override for that slot
#     < any explicit kwarg the Policy itself passes to resolve_component()
#
# `params:` (the Policy's own tunables, read off `self` in train_step) skips
# the components.yaml layer -- it has no `class:` -- but is profile-overridable
# the same way. Neither layer has a Python-level fallback: a kwarg listed in
# neither file is a missing-argument TypeError from the component's own
# __init__.
#
#   uv run python scripts/print_config.py <model> [--profile P]
#
# prints the fully resolved model with every value annotated by which layer
# above it came from.
#
# Switching a slot's `class:` (e.g. critic: MeanStdEnsembleCritic ->
# QRDistributionalCritic, or squash: TanhSquash -> ErfSquash) is a one-word
# edit as long as the new class has a components.yaml entry; if it doesn't,
# spell its kwargs out here instead. Nothing below needs to be edited to *try*
# an alternative, though -- a run config's `model_overrides:` (and therefore
# any scripts/run_sweep.py `model.` axis) can set both kwargs and the `class:`
# itself for one run only:
#
#   uv run python scripts/run_sweep.py --algos AMDP --envs HalfCheetah \
#       --set model.components.critic.class=QRDistributionalCritic
#
# `model:` in a run config (config/online_learning.yaml's `runs:`) can name
# either a plain Policy class below, or one of the `aliases:` shortcuts,
# which resolve to a (policy, profile) pair.
#
# Critic slots accept any QCriticBase subclass from
# src/barl_jax/networks/critic.py: MeanStdEnsembleCritic / MeanEnsembleCritic /
# MinEnsembleCritic (n_models MLP heads, differing only in
# mean/min/mean-minus-rho*std reduction), or HLGaussCritic (a scalar Bellman
# target discretized onto a Gaussian-smoothed histogram and fitted by
# cross-entropy -- classification-as-regression, not distributional).
# None of them has a target network; a CrossQ-style critic is not a separate
# class, just `norm: batchrenorm` (see config/components.yaml).

# `training:` is the third block a policy may carry, alongside `params:` and
# `components:`: the handful of run-config keys that are a property of the
# *algorithm* rather than of the experiment -- rollout_steps, batch_size,
# utd_ratio, epochs_per_rollout, random_steps, lr_warmup_steps (the whitelist
# is model_config.TRAINING_KEYS; anything outside it is a validate() error, because
# the rest of a run -- how long it trains, how many envs, how often it
# evaluates -- belongs in config/online_learning.yaml and nowhere else).
#
# It resolves *between* that file's levels, lowest precedence first:
#
#   online_learning.yaml's `defaults:`
#     < this file's `training:` for the model being run
#     < the active profile's `training:`
#     < online_learning.yaml's `env_defaults:` for that env
#     < the `runs:` entry itself (and any run_sweep.py `run.` axis)
#
# so a model states what its algorithm wants and an explicit per-env or per-run
# statement still overrides it. The five blocks below currently restate today's
# global defaults, so nothing changes until one of them is edited to differ.

SAC:
  training:
    rollout_steps: 5000
    batch_size: 256
    utd_ratio: 2.0

  params:
    entropy_scale: -1.0

  components:
    actor:    {class: StochasticActor, latent_dim: 512, layers: 3}
    critic:   {class: C51Critic, latent_dim: 512, layers: 1 }
    entropy:  {class: AutotuneRegulator }

DIME:
  training:
    rollout_steps: 5000
    batch_size: 256
    utd_ratio: 2.0

  params:
    entropy_scale: -4.0

  components:
    actor:   {class: OUDiffusionActor, latent_dim: 512, layers : 3 }
    critic:  {class: C51Critic, latent_dim: 512, layers: 1 }
    squash:  {class: TanhSquash }
    entropy: {class: AutotuneRegulator }

AMDP:
  training:
    rollout_steps: 5000
    batch_size: 256
    utd_ratio: 2.0

  params:
    entropy_scale: -1.0

    q_score_max_norm: 5.0
    q_score_max_percentile: 95.0

  components:
    actor:   {class: ScoreContinuousActor, latent_dim: 512, layers : 3 }
    critic:  {class: C51Critic, latent_dim: 512, layers: 1 }
    squash:  {class: ErfSquash }
    entropy: {class: AutotuneRegulator }
    
SDAC:
  training:
    rollout_steps: 5000
    batch_size: 256
    utd_ratio: 2.0

  params:
    entropy_scale: -0.9

    num_candidates: 64   # K: softmax candidates in the soft denoising loss
    num_bon: 32          # N: best-of-N, for the played action and the bootstrap

    softmax_temp: 0.25

    explore_init: 0.1
    explore_min: 1.0e-3
    explore_max: 1.0

  components:
    actor:   {class: VPDiffusionActor, latent_dim: 256, layers: 3, num_steps: 20, activation: Mish}
    # Bare, so it is byte-for-byte the critic SAC/DIME/AMDP resolve -- the
    # dime_am net. SDAC's own reference (mahaitongdae/diffusion_policy_online_rl)
    # uses a 256x3 Mish critic; holding this fixed across the matrix is what
    # makes an {algo x env} sweep an algorithm comparison rather than an
    # algorithm-and-critic one. The actor below still follows SDAC's reference.
    critic:  {class: C51Critic, latent_dim: 512, layers: 1 }
    squash:  {class: TanhSquash }
    entropy: {class: AutotuneRegulator }

NCLQL:
  training:
    rollout_steps: 5000
    batch_size: 256
    utd_ratio: 2.0
    random_steps: 30000

  params:
    noise_levels: 10
    steps_per_level: 2

    # The reference's `step_lr`: the level's step is step_size*(sigma_i/sigma_L)^2,
    # the drift is half of that times `temperature`, and the injected noise is
    # its square root. Tied to the ladder, so retune whenever `sigmas` moves.
    step_size: 1.0e-4

    # The paper's `w`, a temperature on Q. It scales the drift whether or not
    # the score is normalized -- normalization replaces the score's *direction
    # vector*, not the step length.
    temperature: 500.0

    normalize_score: True
    clip_actions: True

    reward_scale: 5.0

    action_limit: 1.0
    init_scale: 1.0

  components:
    # Spans the canonical [-1, 1] action range down to a scale where the
    # smoothed Q is effectively the clean one.
    sigmas:  { class: ExponentialSchedule, start: 0.1, end: 0.001, steps: 10 }

    # The reference's scalar ensemble. NCLQLC51Critic / NCLQLHLGaussCritic are
    # the same critic over a categorical / histogram return instead, and the
    # algorithm reads none of that difference -- so the return representation is
    # a one-word axis here, or `--set model.components.critic.class=...`.
    critic:  { class: NCLQLC51Critic, latent_dim: 512, layers: 1 }