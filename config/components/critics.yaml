# Baseline kwargs per critic class. `kind: critic` makes `size:` on a slot
# resolve against presets/sizes.yaml's critic ladder and makes it required, which
# is why no entry sets latent_dim/layers/n_models.
#
# `gamma` is required by QCriticBase itself, so every entry carries it. Only
# EnsembleCritic reduces with a spread, and its `rho` is epistemic pessimism
# *across heads* -- not a risk preference over the return. C51 needs none: it
# reduces by min over its heads. Nor does HLGaussCritic, whose spread `sigma` is
# label smoothing on a discretized scalar regression.
#
# Apart from the three NCLQL* entries and TargetEnsembleCritic, no critic here
# has a target network: the bootstrap is priced by the live weights in the same
# forward as the prediction it trains -- CrossQ's replacement for one. That is
# what `extends: [net.crossq]` buys, and why `polyak_tau: 0.0` below is a
# statement rather than an omission.

# Deliberately identical to C51Critic apart from `rho` replacing
# `num_atoms`/`entropy_coef`, so `--set model.components.critic.class=EnsembleCritic`
# changes the return representation and nothing else.
EnsembleCritic:
  kind: critic
  extends: [net.crossq, optim.critic]
  rho: 1.0
  pessimistic_target: true
  gamma: 0.99
  polyak_tau: 0.0
  target_delay: 1

# EnsembleCritic + a Polyak target, for ported algorithms whose reference
# bootstraps from one. `norm` MUST stay off the running-statistic kinds here: a
# target's separate forward pass removes the shared [(s,a), (s',a')] batch that
# makes BatchRenorm worth having, and QCriticBase raises on the pairing.
TargetEnsembleCritic:
  kind: critic
  extends: [net.layer_relu, optim.critic]
  rho: 1.0
  pessimistic_target: true
  gamma: 0.99
  polyak_tau: 0.005
  target_delay: 1

C51Critic:
  kind: critic
  extends: [net.crossq, optim.critic]
  num_atoms: 101
  entropy_coef: 0.005
  # The two pessimism axes every critic here carries, both off because both are
  # off in dime_am: `rho` prices the heads' disagreement into `value()`, which the
  # reference reduces with `policy_q_reduce_fn = jnp.mean`, and
  # `pessimistic_target` puts it in the Bellman target, which the reference
  # likewise averages. Every policy resolving to this class -- SAC, DIME, AMDP,
  # SDAC -- therefore averages in both places.
  rho: 0.0
  pessimistic_target: false
  gamma: 0.99
  polyak_tau: 0.0
  target_delay: 1

# Same net as C51Critic and EnsembleCritic; only the return representation
# differs, which is what makes the three a clean A/B.
HLGaussCritic:
  kind: critic
  extends: [net.crossq, optim.critic]
  num_bins: 151
  sigma_to_bin_ratio: 0.75
  entropy_coef: 0.0        # shared with the categorical critics; off here
  rho: 0.0
  pessimistic_target: false
  gamma: 0.99
  polyak_tau: 0.0
  target_delay: 1

# --- NC-LQL ----------------------------------------------------------------
#
# All three are the NoiseConditionedCritic mixin over one of the generic critics
# above, so they differ only in how the return is represented and are swapped by
# `class:` alone. Shared across them, and all the reference's (ku-dmlab/NCLQL):
# the mish net with no normalization, lr 1e-4, and a Polyak target at tau 0.005 --
# NC-LQL has no actor to keep the bootstrap action on-distribution, so it needs
# one.
#
# `rho` and `pessimistic_target` are held equal to each critic's generic
# counterpart above so an {NCLQL vs SAC/DIME/AMDP/SDAC} comparison varies the
# algorithm and not how pessimistically its critic prices. If a run's
# `critic/q/mean` runs away from realized returns, `pessimistic_target: true` is
# the first thing to put back on the two categorical ones.
#
# `smoothing_coef` weights the smoothing loss where it is summed with the TD
# loss. The reference takes two *sequential* Adam steps, which -- because Adam
# normalizes per coordinate -- gives each loss a step of the same magnitude
# however large its gradient is. Summing them into one step, as barl's
# one-backward contract requires, loses that. 1.0 reproduces the plain sum.

NCLQLCritic:
  kind: critic
  extends: [net.mish, optim.critic, time.fourier]
  rho: 1.0
  pessimistic_target: true
  smoothing_coef: 1.0
  gamma: 0.99
  polyak_tau: 0.005
  target_delay: 1

# A categorical return distribution instead of a scalar, at C51Critic's own
# `rho`/`pessimistic_target` -- so this and C51Critic differ by NC-LQL's noise
# conditioning and nothing else. The support defaults from the env's return range
# *scaled by `reward_scale`* (NCLQL.__init__ does that), so it needs no per-env
# pinning.
NCLQLC51Critic:
  kind: critic
  extends: [net.mish, optim.critic, time.fourier]
  num_atoms: 101
  entropy_coef: 0.005
  rho: 0.0
  pessimistic_target: false
  smoothing_coef: 1.0
  gamma: 0.99
  polyak_tau: 0.005
  target_delay: 1

# A scalar bootstrap fitted as a Gaussian-smoothed histogram instead of by MSE --
# the A/B that isolates classification-as-regression from the distributional
# bootstrap NCLQLC51Critic also brings.
NCLQLHLGaussCritic:
  kind: critic
  extends: [net.mish, optim.critic, time.fourier]
  num_bins: 151
  sigma_to_bin_ratio: 0.75
  entropy_coef: 0.0
  rho: 0.0
  pessimistic_target: false
  smoothing_coef: 1.0
  gamma: 0.99
  polyak_tau: 0.005
  target_delay: 1
