# Baseline kwargs per actor class. `kind: actor` makes `size:` on a slot resolve
# against presets/sizes.yaml's actor ladder, and makes it required there -- which
# is why no entry below sets latent_dim/layers.
#
# Every actor owns its own squash (`squash_cls`), because the two are not
# separable: AMDP's `erf_k` is a function of its noise schedule, and the score
# actors' raw terminal state is only an action once squashed. The sampler still
# returns that raw state -- the squash is applied by whatever prices or scores it.

StochasticActor:
  kind: actor
  extends: [net.layer_silu, optim.actor]
  squash_cls: TanhSquash
  log_std_min: -20.0
  log_std_max: 2.0
  log_prob_clip: 0.99   # tanh atanh guard in log_prob

ScoreContinuousActor:
  kind: actor
  extends: [net.silu, optim.actor, time.ctrl]
  squash_cls: ErfSquash   # `erf_k` is derived from the noise schedule below

  max_steps: 16
  out_clip: 10000.0     # ctrl_net.py's `outer_clip`
  sigma_min: 0.01
  sigma_max: 2.0
  tau_min: 0.0
  tau_max: 1.0

# The diffusion-policy online-RL references' sampler: a scaled *linear* beta
# ladder, a shrunk prior and the predicted x0 clipped every reverse step. The
# endpoints below are the reference's linspace(1e-4, 0.999) times its 0.3 scale.
#
# SDAC's published numbers came from a different point in this same class's
# space, reachable as a slot or a `model.components.actor.*` sweep axis:
#   ladder_cls: CosineAlphaBarSchedule, ladder_kind: alpha_bar,
#   ladder_start: 0.999, ladder_end: 0.001, ladder_kwargs: {s: 0.008},
#   clip_denoised: false, prior_scale: 1.0, num_steps: 16
DDPMActor:
  kind: actor
  extends: [net.gelu, optim.actor, time.sin_20]
  num_steps: 20
  squash_cls: TanhSquash
  ladder_cls: LinearSchedule
  ladder_kind: beta
  ladder_start: 3.0e-5
  ladder_end: 0.2997
  ladder_kwargs: {}
  clip_denoised: true
  prior_scale: 0.5

# The sampler DIME's reference actually runs (dime_am/diffusion/od/dis.py), as
# opposed to the DDPM-style denoisers above: a fixed Gaussian prior integrated
# forward under a learned control, with a learned step size and a learned
# per-dimension friction. `prior_std` is a standard deviation, not a variance --
# the reference's `sampler.init_std: 2.5` is passed straight to
# MultivariateNormalDiag's scale.
DISActor:
  kind: actor
  extends: [net.gelu, optim.actor, time.pisgrad]
  squash_cls: TanhSquash
  # dime_am trains the sampler's nets with the critic's b1 (init_model shares
  # alg.optimizer.b1), not optax's actor default of 0.9.
  adam_b1: 0.5
  num_steps: 16
  prior_std: 2.5
  dt_init: 0.1          # configs/base.yaml `dt`, shaped by the cosine schedule below
  dt_min: 0.001         # configs/sampler/dt_schedule/cosine.yaml
  dt_s: 0.008
  dt_pow: 2.0
  friction_init: 1.0    # configs/sampler/dis.yaml `friction`
  per_dim_friction: true
  learn_dt: true
  learn_friction: true
  out_clip: 10000.0     # PISGRADNet's `outer_clip`
  dtype: float32        # the reference is fp32, and the log-ratio accumulates
