# Baseline kwargs per actor class. `kind: actor` makes `size:` on a slot resolve
# against presets/sizes.yaml's actor ladder, and makes it required there -- which
# is why no entry below sets latent_dim/layers.
#
# Score-based actors deliberately return a raw, unsquashed terminal state; the
# squash is the owning Policy's decision (its own `squash` slot), not the
# architecture's.

StochasticActor:
  kind: actor
  extends: [net.layer_silu, optim.actor]
  squash_cls: TanhSquash
  log_std_min: -20.0
  log_std_max: 2.0
  log_prob_clip: 0.99   # tanh atanh guard in log_prob

ScoreContinuousActor:
  kind: actor
  extends: [net.silu, optim.actor, time.ctrl]
  max_steps: 16
  sigma_min: 0.01
  sigma_max: 2.0
  tau_min: 0.0
  tau_max: 1.0

# The diffusion-policy online-RL references' sampler: a scaled *linear* ladder, a
# shrunk prior and the predicted x0 clipped every reverse step. Distinct from
# VPDiffusionActor below (cosine, unit prior, no clip), which SDAC's numbers
# depend on -- these are two samplers, not two spellings of one.
DDPMActor:
  kind: actor
  extends: [net.gelu, optim.actor, time.sin_20]
  num_steps: 20
  beta_schedule: linear
  beta_scale: 0.3
  cosine_s: 0.008
  ab_start: 0.999
  ab_end: 0.001
  clip_denoised: true
  prior_scale: 0.5

# DDPMActor at the fixed VP-cosine settings SDAC was tuned on (Ma et al. Table 4),
# named so config and checkpoints keep referring to them by name. The three
# values that make it "VP" used to be hardcoded into its super() call, where no
# run could see them.
VPDiffusionActor:
  kind: actor
  extends: [net.gelu, optim.actor, time.sin_20]
  num_steps: 16
  beta_schedule: vp_cosine
  beta_scale: 0.3
  cosine_s: 0.008
  ab_start: 0.999
  ab_end: 0.001
  clip_denoised: false
  prior_scale: 1.0

OUDiffusionActor:
  kind: actor
  extends: [net.gelu, optim.actor, time.sin_20]
  num_steps: 16
  beta_min: 0.12
  beta_max: 0.18
  beta_scale_min: 0.7
  beta_scale_max: 1.8
  learn_beta_scale: true
  prior_var: 2.5
  anchor_score: true
  # The Euler discretization's stability bound and the total-noise floor the
  # ladder must clear. Both used to be module constants that silently clamped
  # beta_scale_max (policies/dime.py).
  euler_max_step: 0.35
  min_total_noise: 2.0

# The sampler DIME's reference actually runs (dime_am/diffusion/od/dis.py), as
# opposed to the DDPM-style denoisers above: a fixed Gaussian prior integrated
# forward under a learned control, with a learned step size and a learned
# per-dimension friction. `prior_std` is a standard deviation, not a variance --
# the reference's `sampler.init_std: 2.5` is passed straight to
# MultivariateNormalDiag's scale.
DISActor:
  kind: actor
  extends: [net.gelu, optim.actor, time.pisgrad]
  # dime_am trains the sampler's nets with the critic's b1 (init_model shares
  # alg.optimizer.b1), not optax's actor default of 0.9.
  adam_b1: 0.5
  num_steps: 16
  prior_std: 2.5
  dt_init: 0.1          # configs/base.yaml `dt`, shaped by the cosine schedule below
  dt_min: 0.001         # configs/sampler/dt_schedule/cosine.yaml
  dt_s: 0.008
  dt_pow: 2.0
  friction_init: 1.0    # configs/sampler/dis.yaml `friction`
  per_dim_friction: true
  learn_dt: true
  learn_friction: true
  out_clip: 10000.0     # PISGRADNet's `outer_clip`
  dtype: float32        # the reference is fp32, and the log-ratio accumulates
