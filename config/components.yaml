  residual: false
  dtype: float32

  cosine_s: 0.008
  ab_start: 0.999
  ab_end: 0.001

# The diffusion-policy online-RL references' sampler: a scaled *linear* ladder,
# a shrunk prior and the predicted x0 clipped every reverse step. Distinct from
# VPDiffusionActor above (cosine, unit prior, no clip), which SDAC's numbers
# depend on -- these are two samplers, not two spellings of one.
DDPMActor:
  latent_dim: 512
  layers: 3
  num_steps: 20
  time_dim: 8
  time_embed: sin
  time_kwargs: {num_freqs: 20, freq_min: 0.1, freq_max: 100.0, hidden: 32, concat_input: true}
  activation: gelu
  norm: none
  norm_stem: false
  norm_input: false
  norm_after_act: true
  dropout: 0.0
  final_activation: false
  residual: false
  dtype: float32

  beta_schedule: linear
  beta_scale: 0.3
  cosine_s: 0.008
  clip_denoised: true
  prior_scale: 0.5

OUDiffusionActor:
  latent_dim: 512
  layers: 3
  num_steps: 16
  time_dim: 8
  time_embed: sin
  time_kwargs: {num_freqs: 20, freq_min: 0.1, freq_max: 100.0, hidden: 32, concat_input: true}
  activation: gelu
  norm: none
  norm_stem: false
  norm_input: false
  norm_after_act: true
  dropout: 0.0
  final_activation: false
  residual: false
  dtype: float32

  beta_min: 0.12
  beta_max: 0.18
  beta_scale_min: 0.7
  beta_scale_max: 1.8
  learn_beta_scale: true
  prior_var: 2.5
  anchor_score: true


# --- Critics --------------------------------------------------------------
#
# `gamma` is required by QCriticBase itself, so every subclass below carries it.
# Only EnsembleCritic reduces with a spread, and its `rho` is epistemic
# pessimism *across heads* -- not a risk preference over the return. C51 needs
# none: it reduces by min over its heads. Nor does HLGaussCritic, whose spread
# `sigma` is label smoothing on a discretized scalar regression.
#
# No critic here has a target network: the bootstrap is priced by the live
# weights in the same forward as the prediction it trains, CrossQ's (Bhatt et
# al., ICLR 2024) replacement for one. That makes `norm` load-bearing rather
# than cosmetic -- "batchrenorm" is what the single shared forward buys you.

# Deliberately identical to C51Critic below apart from `rho` replacing
# `num_atoms`/`entropy_coef`, so `--set model.components.critic.class=EnsembleCritic`
# changes the return representation and nothing else.
EnsembleCritic:

  lr: 3.0e-4

  activation: relu
  latent_dim: 2048
  layers: 2
  n_models: 2
  rho: 1.0
  gamma: 0.99

  dtype: bfloat16

  norm: batchrenorm
  norm_stem: true
  norm_input: true
  norm_after_act: true
  dropout: 0.0
  final_activation: false
  residual: false

  norm_kwargs: {momentum: 0.01, warmup_steps: 100000}

# EnsembleCritic + a Polyak target, for ported algorithms whose reference
# bootstraps from one. `norm` MUST stay off the running-statistic kinds here:
# a target's separate forward pass removes the shared [(s,a), (s',a')] batch
# that makes BatchRenorm worth having, and QCriticBase raises on the pairing.
TargetEnsembleCritic:

  lr: 3.0e-4

  activation: relu
  latent_dim: 2048
  layers: 2
  n_models: 2
  rho: 1.0
  gamma: 0.99

  polyak_tau: 0.005
  target_delay: 1

  dtype: bfloat16

  norm: layer
  norm_stem: true
  norm_input: true
  norm_after_act: true
  dropout: 0.0
  final_activation: false
  residual: false

C51Critic:

  lr: 3.0e-4
  activation: gelu
  latent_dim: 2048
  layers: 2
  n_models: 2
  num_atoms: 101
  entropy_coef: 0.005
  gamma: 0.99

  # Put the heads' `min` in the Bellman target too, not just in the price a
  # policy improves against. Off here because SAC/DIME/AMDP all learn this env
  # with the averaging target; SDAC turns it on (see config/models.yaml).
  pessimistic_target: false

  dtype: bfloat16

  norm: batchrenorm
  norm_stem: true
  norm_input: true
  norm_after_act: true
  dropout: 0.0
  final_activation: false
  residual: false

  norm_kwargs: {momentum: 0.01, warmup_steps: 100000}

HLGaussCritic:

  lr: 3.0e-4
  
  activation: gelu
  latent_dim: 2048
  layers: 2
  n_models: 2
  num_bins: 151
  sigma_to_bin_ratio: 0.75
  gamma: 0.99

  dtype: bfloat16

  norm: batchrenorm
  norm_stem: true
  norm_input: true
  norm_after_act: true
  dropout: 0.0
  final_activation: false
  residual: false

  norm_kwargs: {momentum: 0.01, warmup_steps: 100000}


# NC-LQL's critics (src/barl_jax/policies/lql.py). All three are the
# NoiseConditionedCritic mixin over one of the generic critics above, so they
# differ only in how the return is represented and are swapped by `class:`
# alone: `--set model.components.critic.class=NCLQLC51Critic`. Shared across
# them, and all the reference's (ku-dmlab/NCLQL): the 256x3 mish net with no
# normalization, lr 1e-4, and a Polyak target at tau 0.005 -- the one target net
# in this file, because NC-LQL has no actor to keep the bootstrap action
# on-distribution. `time_dim` is the width of the level encoding concatenated to
# the action; `norm` MUST stay off the running-statistic kinds, as for every
# other target-net critic here.
#
# `smoothing_coef` weights the smoothing loss where it is summed with the TD
# loss. The reference takes two *sequential* Adam steps (TD, then smoothing at
# the already-updated params), which -- because Adam normalizes per coordinate
# -- gives each loss a step of the same magnitude however large its gradient is.
# Summing them into one step, as barl's one-backward contract requires, loses
# that: the larger-gradient loss dominates, and after `reward_scale` that is the
# TD term. 1.0 reproduces the plain sum; raise it to compensate.

# The reference's: two scalar heads. `rho: 1.0` at `n_models: 2` is exactly its
# `min(target_q1, target_q2)` -- see EnsembleCritic's docstring.
NCLQLCritic:
  latent_dim: 256
  layers: 3
  n_models: 2
  rho: 1.0
  smoothing_coef: 1.0
  time_dim: 16
  polyak_tau: 0.005
  
  lr: 1.0e-4

  gamma: 0.99
  
  time_embed: "fourier"

  dtype: float32

  activation: mish
  norm: none
  norm_stem: false
  norm_input: false
  norm_after_act: true

# A categorical return distribution instead of a scalar. `pessimistic_target` is
# on where C51Critic leaves it off: it is what puts the heads' `min` in the
# Bellman target, which is where the reference's pessimism lives and NC-LQL has
# no actor to provide another brake. The support defaults from the env's return
# range *scaled by `reward_scale`* (NCLQL.__init__ does that), so it does not
# need pinning per env.
NCLQLC51Critic:
  latent_dim: 256
  layers: 3
  n_models: 2
  num_atoms: 101
  entropy_coef: 0.005
  pessimistic_target: true
  smoothing_coef: 1.0
  time_dim: 16
  polyak_tau: 0.005

  lr: 1.0e-4

  gamma: 0.99

  time_embed: "fourier"

  dtype: float32

  activation: mish
  norm: none
  norm_stem: false
  norm_input: false
  norm_after_act: true

# The same scalar bootstrap as NCLQLCritic (`min` over the heads' expectations),
# fitted as a Gaussian-smoothed histogram instead of by MSE -- so this is the
# A/B that isolates classification-as-regression from the distributional
# bootstrap NCLQLC51Critic also brings.
NCLQLHLGaussCritic:
  latent_dim: 256
  layers: 3
  n_models: 2
  num_bins: 151
  sigma_to_bin_ratio: 0.75
  smoothing_coef: 1.0
  time_dim: 16
  polyak_tau: 0.005

  lr: 1.0e-4

  gamma: 0.99

  time_embed: "fourier"

  dtype: float32

  activation: mish
  norm: none
  norm_stem: false
  norm_input: false
  norm_after_act: true


# --- Duals / squashes -----------------------------------------------------
#
# `target` is deliberately absent here: entropy regulators get theirs from the
# owning Policy (action_dim * entropy_scale), so a baseline would be dead
# weight for those and only the trust-region slot sets one in models.yaml.

AutotuneRegulator:
  lr: 1.0e-3
  alpha_init: 1.0
  min_alpha: 0.0000001
  max_alpha: 500.0

TanhSquash: {}

ErfSquash: {}   # `erf_k` is always derived at construction time -- see AMDP.__init__
