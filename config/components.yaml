VPDiffusionActor:
  latent_dim: 512
  layers: 3
  num_steps: 16
  time_dim: 8
  time_embed: sin
  time_kwargs: {num_freqs: 20, freq_min: 0.1, freq_max: 100.0, hidden: 32, concat_input: true}
  activation: gelu
  norm: none
