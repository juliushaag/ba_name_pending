# `model:` shortcuts resolving to a (policy, profile) pair. An alias is usable
# anywhere a policy name is -- including as a scripts/submit.py `--algos`
# value, which a `--set` override is not. That is what it is for: a named variant
# you want to run as its own arm of a sweep, rather than one you dial in per run.
#
# A profile lives in the policy's own file under `profiles:`, and may override a
# slot's `size:`, that slot's kwargs, the policy's `params:` and its `training:`
# -- everything except a slot's `class:`. It sits above the slot and below the
# run's own `model_overrides:`, so `--set` still wins over a profile.
#
#   # config/models/sac.yaml
#   SAC:
#     ...
#     profiles:
#       big:
#         training: {batch_size: 1024}
#         critic:   {size: xlarge}
#
#   # here
#   aliases:
#     sac_big: {policy: SAC, profile: big}
#
#   uv run python scripts/submit.py --algos SAC sac_big --envs HalfCheetah
#
# Note that for a plain capacity comparison a `size:` axis is the simpler tool --
# `--set model.components.critic.size=large` needs no alias at all. Reach for a
# profile when a variant is several coordinated changes that deserve one name.

aliases: {}
