DIME:
  policy: MaxEntRLPolicy
  training:
    batch_size: 256
    utd_ratio: 2.0

  params:
    entropy_scale: -4.0

    # dime_am configs/alg/am.yaml + dime.yaml: policy_delay: 3. Gates the actor
    # and the entropy dual together; the critic keeps stepping every grad step.
    policy_delay: 3
    normalize_obs: true
    entropy_in_target: true

  components:
    # dime_am's score net is 3 hidden Dense(256) + head (PISGRADNet:
    # num_hid 256, num_layers 3). barl's MLP is stem + `layers` blocks +
    # head, so that depth is `layers: 2` -- stated inline because the tier
    # ladder is width-at-fixed-depth by design.
    #
    # The reference's actor is a time-reversed diffusion *sampler* with a
    # learned step tier and per-dimension friction, not a DDPM denoiser, and its
    # entropy term is the path KL the integration accumulates.
    actor:   {class: DISActor,           tier: medium }
    critic:  {class: C51Critic,          tier: xlarge }
    entropy: {class: AutotuneRegulator}
