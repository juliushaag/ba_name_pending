AMDP:
  training:
    batch_size: 256
    utd_ratio: 2.0

  params:
    entropy_scale: -1.0

    # dime_am configs/alg/am.yaml + dime.yaml: policy_delay: 3. Gates the actor
    # and the entropy dual together; the critic keeps stepping every grad step.
    policy_delay: 3

    q_score_max_norm: 5.0
    q_score_max_percentile: 95.0

  components:
    # dime_am's control net is 3 hidden Dense(256) + head (ctrl_net.py:
    # num_hid 256, num_layers 4, whose last entry is the head). Same depth
    # as DIME's; see the note there on `layers: 2`.
    actor:   {class: ScoreContinuousActor, size: medium, layers: 2}
    critic:  {class: C51Critic,            size: xlarge}
    squash:  {class: ErfSquash}
    entropy: {class: AutotuneRegulator}
