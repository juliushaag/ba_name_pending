SDAC:
  policy: MaxEntRLPolicy
  training:
    batch_size: 256
    utd_ratio: 2.0

  params:
    entropy_scale: -0.9
    policy_delay: 1
    normalize_obs: true
    # SDAC's Bellman target carries no entropy bonus in the reference: the
    # dual trains purely off the actor's DSM loss (the exploration noise is
    # its own term beside it), not off anything added to the critic's target.
    entropy_in_target: false

  components:
    actor:   {class: DDPMActor, tier: medium, num_steps: 20 }
    critic:  {class: C51Critic, tier: xlarge}
    entropy: {class: AutotuneRegulator}
