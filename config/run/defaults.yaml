# Every run-level key, with no exception -- config.RUN_KEYS validates this file
# against the set the code actually reads, and scripts/lint_config.py fails if a
# key is read anywhere without being declared here. There is no `cfg.get(key,
# default)` left in the trainer: a key missing here is a startup error, not a
# silent fallback. That is what makes the wandb config panel the whole truth
# about a run.
#
# Six of these (rollout_steps, batch_size, utd_ratio, epochs_per_rollout,
# random_steps, lr_warmup_steps -- model_config.TRAINING_KEYS) are also settable
# by a model's own `training:` block, for knobs that belong to the *algorithm*
# rather than to the experiment. The values here stay the fallback for a model
# that declares none of them, and an explicit per-env or per-run statement still
# wins over the model. Every other key below is run-only: a model that tries to
# set one is a validate() error, not a silent no-op.

# --- what to run -----------------------------------------------------------
checkpoint: null           # path to resume from, or null to train from scratch
seed: 0                    # base seed; a multi-seed run uses seed..seed+num_seeds-1
num_seeds: 3               # seeds vmapped into one process (one CUDA context, one
                           # compiled step). Bit-identical to running each alone.
validate: false            # smoke-test mode: one rollout chunk + one train_step
run_dir: null              # a sweep's per-run directory; null = the global
                           # checkpoints/<model>/<env>/<timestamp>/ tree
sweep_tag: null            # wandb tag grouping one sweep's runs

# --- budget ----------------------------------------------------------------
total_env_steps: 1000000   # stop once this many env steps have been collected
random_steps: 5000         # random-action buffer fill before training starts.
                           # dime_am's `learning_starts`; training on a buffer
                           # holding only the first few on-policy steps is what
                           # it exists to avoid.

# --- rollout ---------------------------------------------------------------
rollout_steps: 1024        # env steps collected per outer iteration (across all
                           # num_envs), i.e. how stale the behaviour policy is
                           # allowed to get. dime_am refreshes it every single env
                           # step (SB3 train_freq=(1, "step")); a vectorized
                           # rollout cannot go below num_envs, and below ~1024 the
                           # per-iteration cost stops being free -- every rollout
                           # flushes a partial chunk per env, so halving this
                           # doubles the chunk count and the O(buffer) flat-cache
                           # rebuild grows superlinearly (85ms -> 244ms -> 431ms
                           # at 1024/512/256 on a full 1M buffer). Keep it a
                           # multiple of num_envs: steps_per_iter rounds down while
                           # the env_steps counter advances by the full value, so a
                           # remainder makes the two drift apart.
num_envs: 32               # parallel rollout envs (policy inference is flat in
                           # batch size out to ~512, so the whole batch costs what
                           # one env would; episodes persist across rollouts, so
                           # this no longer shortens the horizon)
buffer_size: 1000000       # max transitions kept (whole trajectory chunks are
                           # evicted/kept, never split, so this is a budget)

# --- optimization ----------------------------------------------------------
batch_size: 256
utd_ratio: 2.0             # off-policy: grad steps per outer iteration =
                           # round(rollout_steps * utd_ratio)
epochs_per_rollout: 32     # on-policy only -- currently unread, the on-policy
                           # path is unported (trainer.train raises)
lr_warmup_steps: 0         # grad steps of linear 0 -> base_lr ramp before the
                           # post-warmup decay kicks in; 0 disables the ramp and
                           # starts at the base rate. Off because dime_am has no
                           # warmup either (configs/base.yaml: `warmup: const`
                           # with use_step_size_scheduler False) -- with the
                           # decay already flat, a ramp was the only thing left
                           # making the effective rate depend on the step count.
lr_decay: constant         # shape of the post-warmup decay (Policy.DECAYS).
                           # `constant` because every reference here holds its
                           # rate flat (dime_am configs/base.yaml:
                           # use_step_size_scheduler: False), and a decay to 0
                           # at total_env_steps * utd_ratio silently truncates
                           # the run: our DIME on humanoid-run gained 5.9 return
                           # per 100k env steps over the last 200k where the
                           # reference gained 27.4, at an LR multiplier falling
                           # 0.31 -> 0.00. It also makes the horizon part of the
                           # experiment, since the schedule rescales with it.
                           # The gradient clip is *not* here: it belongs to each
                           # component's optimizer (config/presets/optim.yaml).

# --- evaluation ------------------------------------------------------------
eval_every: 25000          # grad steps between evals
eval_runs: 20              # episodes per eval, run in parallel
eval_videos: 1             # of those runs, how many render frames (they run on
                           # their own env). Rendering costs ~140x the env step,
                           # so this is most of an eval's wall clock. null = all.

# --- logging ---------------------------------------------------------------
log_every: 250             # grad steps between primary-tier logs
debug_every: 1000          # grad steps between debug-tier logs (min/max/std/
                           # quantiles, gradient health)
wandb_finish_timeout: 300  # seconds run.finish() may spend uploading before it
                           # gives up. wandb's own default is 0 = block forever,
                           # which is how a finished run was seen to sit for 17
                           # minutes with wandb-core idle and the network fine --
                           # on a batch job that is walltime burned after the
                           # science is done. Whatever it could not send stays
                           # in wandb/ and `wandb sync <dir>` pushes it later.
