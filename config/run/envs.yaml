# Per-environment facts and per-environment run overrides, in one place.
#
# `stats:` are env-derived values no gym space reports -- the return range a
# categorical/histogram critic sizes its support from. They used to live in the
# Environment class bodies (environments/mujoco_gym.py, dm_control.py), which put
# a tunable in Python where no run could see it. A family base's entry applies to
# every env under it, and one env's own entry overrides a single key.
#
# Every `return_min`/`return_max` below is a symmetric bound on the *discounted*
# value a critic regresses, not on the undiscounted episode return -- at gamma
# 0.99 over a 1000-step horizon the two differ by 10x. Following dime_am's
# convention: twice the discounted bound `R*(1 - gamma^T)/(T*(1 - gamma))`,
# symmetric. The factor of two is headroom for transient over-estimation, which a
# support pinned at the true bound would clip and then be unable to correct; the
# symmetry keeps 0 -- where a near-uniform head prices, and where `entropy_coef`
# pulls -- at the centre.
#
# Humanoid and Ant are dime_am's own numbers (README: `alg.critic.v_min=-1600
# alg.critic.v_max=1600`, "the same values for both gym environments"), and the
# DMC +-200 is its configs/alg/dime.yaml. The rest follow the rule -- Reacher's
# T=50 and Pusher's T=100 make their factor 0.790 and 0.634 rather than 0.100.
#
# The cost of that headroom is resolution early: on DMC the bin is 4.0 wide and
# HumanoidRun's value is ~0.2 under a random policy, so almost the whole signal
# quantizes away until it climbs past ~5. dime_am reaches 448 on humanoid-run
# through exactly this, so it is a slow start, not a wall. A run's actual bin
# width is logged as `model/derived.critic.bin_width`; see
# tests/test_env_supports.py.
#
# `defaults:` are ordinary run keys applied to every run on that env, in this
# file's runs and in every scripts/submit.py grid alike -- so a sweep spanning
# envs of very different cost/horizon needs no per-env run entry just to restate
# the same handful of keys.

environments:
  # Family bases first: an entry here applies to every env deriving from it, and
  # one env's own entry below overrides a single key.
  # `rollout_steps: 1` collects one env step per outer iteration, so every
  # per-iteration cost -- StackedPolicy, num_params(), and the ~40 wandb.log()
  # calls a 10-seed run fans out per iteration at ~150 us each -- is paid once
  # per env step. At 1M steps that was ~1.7 h of an 8 h budget in logging alone.
  # DMC is synchronous, so raising num_envs does not change the physics cost per
  # env step (N sub-envs step sequentially either way); it only amortizes the
  # fixed part. Kept equal to rollout_steps, per the note in run/defaults.yaml.
  DMControlEnvironment:
    stats:    {return_min: -200.0, return_max: 200.0}
    defaults: {num_envs: 16, rollout_steps: 16}

  # Dog is the heaviest model in the suite -- 223-dim obs, 38-dim action, 97 MB
  # of RSS per env against ~10 MB for the rest -- and the envs are resident for
  # the whole run. Halved so the rollout envs, the `eval_runs` x num_seeds eval
  # envs and a 10-seed replay buffer fit the job's --mem together.
  DogRun:
    defaults: {num_envs: 8, rollout_steps: 8}

  # ManiSkill's reward is `normalized_dense`, so in [0, 1] per step like DMC's --
  # what differs is the horizon, 50 steps against DMC's 1000. Same derivation:
  # twice the discounted bound (1 - gamma^T)/(1 - gamma) at gamma 0.99, symmetric.
  # PegInsertionSide runs 100 steps and so declares its own.
  #
  # NOTE: on these envs `terminated` means the task *succeeded*
  # (envs/sapien_env.py sets it from info["success"]), the opposite of a MuJoCo
  # humanoid falling over. `eval/success_rate` reads ManiSkill's own
  # info["success"] rather than inferring it -- see policy.episode_success.
  ManiSkillEnvironment:    {stats: {return_min: -79.0,  return_max: 79.0}}
  PegInsertionSide:        {stats: {return_min: -126.79, return_max: 126.79}}

  HalfCheetah:            {stats: {return_min: -3200.0,  return_max: 3200.0}}
  Hopper:                 {stats: {return_min: -900.0,   return_max: 900.0}}
  Walker2d:               {stats: {return_min: -1400.0,  return_max: 1400.0}}
  Ant:                    {stats: {return_min: -1600.0,  return_max: 1600.0}}
  Humanoid:               {stats: {return_min: -1600.0,  return_max: 1600.0}}
  HumanoidStandup:        {stats: {return_min: -80000.0, return_max: 80000.0}}
  InvertedPendulum:       {stats: {return_min: -200.0,   return_max: 200.0}}
  InvertedDoublePendulum: {stats: {return_min: -2000.0,  return_max: 2000.0}}
  Reacher:                {stats: {return_min: -160.0,   return_max: 160.0}}
  Swimmer:                {stats: {return_min: -80.0,    return_max: 80.0}}
  Pusher:                 {stats: {return_min: -380.0,   return_max: 380.0}}

  # Humanoid:
