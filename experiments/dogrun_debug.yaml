# A lightweight base config for short DogRun comparisons across algorithms.
#
#   uv run python scripts/submit.py --config config/experiments/dogrun_debug.yaml
#
# This is still a real training run, just budget-limited: one seed, DogRun,
# 100k env steps max, and no rendered eval videos.

defaults:
  total_env_steps: 100000
  num_seeds: 3
  eval_video_every: null

runs:
  - {model: SAC, env: DogRun}
