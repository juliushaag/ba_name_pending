# Sweep all shipped algorithms on DogRun against the short debug budget.
#
# Dry run:
#   uv run python scripts/submit.py --grid src/barl_jax/defaults/experiments/dogrun_debug_sweep.yaml --dry-run
#
# Real debug sweep:
#   uv run python scripts/submit.py --grid src/barl_jax/defaults/experiments/dogrun_debug_sweep.yaml --debug


axes:
  run.total_env_steps: [100000]
  run.num_seeds: [3]
  run.eval_video_every: [null]
  algo: [SAC, AMDP, DIME, SDAC, NCLQL]
  env: [DogRun]
  seed: [0]

exclude: []
