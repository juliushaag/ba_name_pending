# Does normalization replace the target network, and is weight norm separable
# from the target kind? Full 2x2x2 of target kind x weight_norm x norm with
# joint_forward fixed (batchrenorm needs it), on the two strongest heads.
#
#   uv run python scripts/submit.py --grid experiments/sac_critic_target_norm.yaml --seeds 3 --max-parallel 3

axes:
  algo: [SAC]
  env: [HalfCheetah]
  run.total_env_steps: [100000]
  model.components.critic.class: [EnsembleCritic, C51Critic]
  model.components.critic.target.kind: [none, polyak]
  model.components.critic.target.joint_forward: [true]
  model.components.critic.weight_norm: [false, true]
  model.components.critic.mlp.norm: [none, batchrenorm]
  model.components.critic.ensemble.value_reduce: [min]
  model.components.critic.ensemble.target_reduce: [min]
