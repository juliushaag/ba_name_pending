# SAC over every critic composition the critic rewrite ships: the four value-head
# defaults plus the named presets (critics/presets.py) spelled out as overrides.
# NCLQL's noise-conditioned objective needs the Langevin actor, so it is not here.
#
#   uv run python scripts/submit.py --grid experiments/sac_critic_sweep.yaml \
#     --seeds 3 --executor tmux --max-parallel 1

axes:
  algo: [SAC]
  env: [HalfCheetah]
  run.total_env_steps: [100000]
  model.components.critic:
    - {class: DirectCritic}
    - {class: EnsembleCritic}
    - {class: HLGaussCritic}
    - {class: C51Critic}
    # target_ensemble preset
    - class: EnsembleCritic
      target: {kind: polyak, joint_forward: false}
      mlp: {norm: layer, norm_kwargs: {epsilon: 1.0e-5}}
    # xqc preset
    - class: C51Critic
      target: {kind: polyak, joint_forward: true}
      ensemble: {n_models: 2, value_reduce: mean, target_reduce: min}
      mlp: {activation: relu, norm: batch, norm_input: true, norm_stem: true,
            norm_after_act: false, norm_kwargs: {momentum: 0.99, epsilon: 0.001},
            dtype: float32}
      weight_norm: true
      latent_dim: 512
      layers: 3
      adam_b1: 0.9
      num_bins: 101
      entropy_coef: 0.0
    - {class: FloqCritic}
