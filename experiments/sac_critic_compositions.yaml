# Every valid critic composition under SAC: value head x bootstrap x norm x
# ensemble reduction (the same grid tests/conftest.py VARIANTS covers).
# bootstrap: crossq = {kind: none, joint_forward: true}
#            target = {kind: polyak, joint_forward: false}
#            xqc    = {kind: polyak, joint_forward: true, weight_norm: true}
#
#   uv run python scripts/submit.py --grid experiments/sac_critic_compositions.yaml --seeds 1 --max-parallel 3

axes:
  algo: [SAC]
  env: [HalfCheetah]
  run.total_env_steps: [100000]
  model.components.critic.class: [DirectCritic, EnsembleCritic, HLGaussCritic, C51Critic]
  model.components.critic.target.kind: [none, polyak]
  model.components.critic.target.joint_forward: [true, false]
  model.components.critic.weight_norm: [false, true]
  model.components.critic.mlp.norm: [none, layer, batchrenorm]
  model.components.critic.ensemble.value_reduce: [mean, min]
  model.components.critic.ensemble.target_reduce: [mean, min]

exclude:
  # bootstrap: only crossq / target / xqc
  - {model.components.critic.target.kind: none, model.components.critic.target.joint_forward: false}
  - {model.components.critic.target.kind: none, model.components.critic.weight_norm: true}
  - {model.components.critic.target.kind: polyak, model.components.critic.target.joint_forward: false, model.components.critic.weight_norm: true}
  - {model.components.critic.target.kind: polyak, model.components.critic.target.joint_forward: true, model.components.critic.weight_norm: false}
  # batch statistics need the joint (s,a)/(s',a') forward
  - {model.components.critic.mlp.norm: batchrenorm, model.components.critic.target.joint_forward: false}
  # value and target reduction move together
  - {model.components.critic.ensemble.value_reduce: mean, model.components.critic.ensemble.target_reduce: min}
  - {model.components.critic.ensemble.value_reduce: min, model.components.critic.ensemble.target_reduce: mean}
  # one member: min == mean, the run would be an exact duplicate
  - {model.components.critic.class: DirectCritic, model.components.critic.ensemble.value_reduce: min}
