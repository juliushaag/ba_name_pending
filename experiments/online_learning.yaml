# The default run list for scripts/submit.py.
#
#   uv run python scripts/submit.py [--config path/to/this.yaml]
#
# Run keys come from config/run/defaults.yaml and per-env overrides from
# config/run/envs.yaml; this file carries only what is specific to *these* runs.
# Merge order per run, lowest first:
#
#   config/run/defaults.yaml
#     < this file's `defaults:`
#     < the model's own `training:` block (config/models/<policy>.yaml)
#     < config/run/envs.yaml's `defaults:` for that env
#     < the `runs:` entry itself (and any submit.py `run.` axis)
#
# A run entry (or `defaults:`) may also carry `model_overrides:`, a dotted-path
# map layered over the model config -- `{components.critic.tier: large,
# params.entropy_scale: -2.0}`. Unlike every other key those merge key-wise
# across the levels instead of replacing wholesale. submit.py's `model.*` and
# `run.*` grid axes write exactly these.

defaults: {}

runs:
  - {model: SAC,  env: HalfCheetah}
