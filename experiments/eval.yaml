# Batch evaluation for scripts/evaluate.py.
#
#   uv run python scripts/evaluate.py --config experiments/eval.yaml
#
# Each `runs:` entry evaluates one `path` -- a single policy checkpoint, a
# run directory, or a whole sweep (every seed's checkpoint under it, same
# discovery as the plain `scripts/evaluate.py <path>` CLI). Any key a run
# entry omits falls back to `defaults:` below, then evaluate.py's own CLI
# defaults (see --help): checkpoint: best, mode: [default], episodes: 10,
# num_envs: 8, num_candidates: 8, top_k: 2, sigma: 0.1, seed: 0.
#
# `env` is optional -- omitted, it is read from the checkpoint's own saved
# run config (a sweep's config.yaml), exactly like the CLI's --env. It has
# to be given explicitly for a checkpoint saved without one, e.g. anything
# under checkpoints/ that predates that config.yaml convention.
#
# `output` is where the combined results land as one JSON file, keyed by
# checkpoint path then mode -- `--output` on the command line overrides it.

output: results/eval.json

defaults:
  episodes: 20
  num_candidates: 8

runs:
  # A sweep dir: every seed's `best` checkpoint, env read from its config.yaml.
  - path: sweeps/2026-08-27_13-23-15/SDAC_HumanoidRun_10seeds
    mode: [default, mean, bon]

  # One checkpoint saved without a config.yaml alongside it -- env is required.
  - path: checkpoints/amdp/halfcheetah/2026-08-25_11-23-21/best
    env: HalfCheetah
    mode: [default, topk]
    top_k: 3
