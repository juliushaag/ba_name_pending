[project]
name = "barl_jax"
version = "0.1.0"
requires-python = ">=3.11"
description = "Composable JAX actor-critic research framework"
readme = "README.md"
dependencies = [
  "numpy>=1.26", "jax>=0.10.0", "flax>=0.12.8", "optax>=0.2.8",
  "orbax-checkpoint>=0.12.1", "gymnasium>=1.3.0", "pyyaml>=6.0.3",
]

[project.optional-dependencies]
logging = ["wandb[media]>=0.27.2", "rich>=15.0.0"]
mujoco = ["gymnasium[mujoco]>=1.3.0"]
dm-control = ["dm-control>=1.0.43", "shimmy[dm-control]>=2.0.1"]
mani-skill = ["mani-skill>=3.0.1"]
humanoid-bench = ["humanoid-bench"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"barl_jax" = "."}
packages = ["barl_jax", "barl_jax.actors", "barl_jax.critics", "barl_jax.config",
            "barl_jax.environments", "barl_jax.networks", "barl_jax.policies"]

[tool.setuptools.package-data]
barl_jax = ["defaults/**/*.yaml"]
