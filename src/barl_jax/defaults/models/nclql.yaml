NCLQL:
  policy: RLPolicy
  training:
    batch_size: 256
    utd_ratio: 2.0
    random_steps: 30000

  components:
    actor:
      class: LangevinActor
      steps_per_level: 2
      step_size: 1.0e-4
      temperature: 500.0
      normalize_score: true
      clip_actions: true
      action_limit: 1.0
      init_scale: 1.0
    critic:
      class: NCLQLC51Critic
      tier: xlarge
      reward_scale: 1.0
      # One ladder for Langevin sampling and the critic's smoothing loss.
      noise_schedule: {class: ExponentialSchedule, start: 0.1, end: 0.001, steps: 10}
