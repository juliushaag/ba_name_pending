NCLQL:
  policy: NCLQL   # identity mapping today; a template shares this key across models
  training:
    batch_size: 256
    utd_ratio: 2.0
    random_steps: 30000

  params:
    noise_levels: 10
    steps_per_level: 2

    # The reference's `step_lr`: the level's step is step_size*(sigma_i/sigma_L)^2,
    # the drift is half of that times `temperature`, and the injected noise is its
    # square root. Tied to the ladder, so retune whenever `sigmas` moves.
    step_size: 1.0e-4

    # The paper's `w`, a temperature on Q. It scales the drift whether or not the
    # score is normalized -- normalization replaces the score's *direction
    # vector*, not the step length.
    temperature: 500.0

    normalize_score: true
    clip_actions: true

    reward_scale: 1.0

    action_limit: 1.0
    init_scale: 1.0

  components:
    # Spans the canonical [-1, 1] action range down to a scale where the smoothed
    # Q is effectively the clean one.
    sigmas: {class: ExponentialSchedule, start: 0.1, end: 0.001, steps: 10}

    # NCLQLCritic / NCLQLHLGaussCritic are the same critic over a scalar /
    # histogram return instead, and the algorithm reads none of that difference --
    # so the return representation is a one-word axis here.
    critic: {class: NCLQLC51Critic, tier: xlarge}
