SAC:
  policy: MaxEntRLPolicy
  training:
    batch_size: 256
    utd_ratio: 2.0

  params:
    entropy_scale: -1.0
    policy_delay: 1         # every gradient step -- SAC's reference has no delay
    normalize_obs: true
    entropy_in_target: true

  components:
    actor:   {class: StochasticActor,    tier: medium}
    critic:  {class: C51Critic,          tier: xlarge}
    entropy: {class: AutotuneRegulator}
