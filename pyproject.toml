[project]
name = "ba"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "barl_jax",
    "jax[cuda13]>=0.10.0",
    "ale-py>=0.12.0",
    "einops>=0.8.2",
    "gymnasium-robotics>=1.4.2",
    "gymnasium[box2d,classic-control]>=1.3.0",
    "imageio>=2.37.3",
    "minari[all,hf]>=0.5.3",
    "mujoco>=3.10.0",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "swig>=4.4.1",
    "wandb[media]>=0.27.2",
    "shimmy[dm-control]>=2.0.1",
    "dm-control>=1.0.43",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "playground>=0.2.0",
    "warp-lang==1.13.0",
    "cloc>=0.2.5",
]


[tool.uv.sources]
barl_jax = { path = "src/barl_jax", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
# -n 4 is the sweet spot measured on this box: XLA's own compilation is already
# multi-threaded, so more workers just duplicate imports. Use `-n 0` to debug.
addopts = "-n 4"
