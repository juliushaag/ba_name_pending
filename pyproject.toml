[project]
name = "barl_jax"
version = "0.1.0"
description = "Composable JAX/Flax-NNX off-policy actor-critic research framework"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "jax[cuda13]>=0.10.0",
    "flax>=0.12.8",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.1",
    "gymnasium[classic-control]>=1.3.0",
    "imageio>=2.37.3",
    "mujoco>=3.10.0",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "wandb[media]>=0.27.2",
    "shimmy[dm-control]>=2.0.1",
    "dm-control>=1.0.43",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "mani-skill>=3.0.1",
    "humanoid_bench",
    "myosuite==2.12.2; python_version < '3.14'",
]


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
# humanoid_bench's own setup.py uses find_packages(), which silently drops
# every subpackage missing an __init__.py (dmc_deps, envs, mjx/envs) from a
# normal wheel build -- installing from git directly hits that and fails at
# import time. An editable install of a local checkout sidesteps it (setuptools'
# compat editable mode puts the whole source tree on sys.path instead of just
# the packages it found), which is why this is a path source rather than a git
# one -- uv doesn't support `editable` on a git source. See
# third_party/humanoid-bench (a submodule, not vendored, since it carries ~250
# MB of MuJoCo mesh/texture assets this project doesn't own).
humanoid_bench = { path = "third_party/humanoid-bench", editable = true }

[tool.uv]
# humanoid_bench's setup.py pins exact (and by now ancient) versions of deps
# this project already depends on at much newer versions -- resolution is
# otherwise unsatisfiable. override-dependencies lets this project's own
# constraints win; HumanoidBenchEnvironment.__init__ monkeypatches the one
# place (dm_control-style named MuJoCo struct indexing) where a mujoco this
# much newer than 3.1.6 actually breaks humanoid_bench at runtime.
# MyoSuite 2.12.2 also caps gymnasium<1.3 and mujoco<3.7. Its CPU
# environments are exercised against our newer versions in test_myosuite.py;
# keep those versions shared with the other simulator families. MyoSuite's
# Python <3.14 requirement is respected by the dependency marker above.
override-dependencies = [
    "rich>=13.7.1",
    "gymnasium>=1.3.0",
    "mujoco>=3.10.0",
    "dm_control>=1.0.43",
    "torch>=2.3.1",
    "opencv-python>=4.13.0.92",
    "imageio>=2.37.3",
    "brax>=0.14.2",
    "mujoco-mjx>=3.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.3",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
# -n 4 is the sweet spot measured on this box: XLA's own compilation is already
# multi-threaded, so more workers just duplicate imports. Use `-n 0` to debug.
addopts = "-n 4"
pythonpath = ["."]

[tool.ruff]
# Only first-party code: the submodule and installed/generated trees are not
# ours to fix and are excluded by default (.venv, .git, egg-info) or here.
extend-exclude = ["third_party", "wandb", "sweeps", "checkpoints", "logs"]
line-length = 100
indent-width = 2

[tool.ruff.lint]
# Deliberately small: syntax errors, pyflakes (unused/undefined names) and
# import sorting. Style/format rules come later, once these are clean and
# staying clean is enforced in CI.
select = ["E9", "F", "I"]
